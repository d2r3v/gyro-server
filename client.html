<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gyroscope Client</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 50px;
        }
        h1 {
            font-size: 24px;
        }
        p {
            font-size: 18px;
        }
    </style>
</head>
<body>
    <h1>Gyroscope Data</h1>
    <p id="status">Connecting...</p>
    <p id="data">No data yet</p>

    <script>
        // Connect to WebSocket server
        const ws = new WebSocket('ws://10.80.26.85:8080'); 
    
        // Update status when connected
        ws.onopen = () => {
            document.getElementById('status').textContent = 'Connected to server';
        };
    
        // Handle server errors
        ws.onerror = (error) => {
            document.getElementById('status').textContent = 'Error connecting to server';
            console.error('WebSocket error:', error);
        };
    
        // Handle WebSocket disconnection
        ws.onclose = () => {
            document.getElementById('status').textContent = 'Disconnected from server';
            console.log('WebSocket connection closed');
        };
    
 // Check if Generic Sensor API is supported
 if ('Gyroscope' in window) {
        try {
            // Create a gyroscope sensor
            const gyroscope = new Gyroscope({frequency: 60}); // Adjust frequency if needed

            // Start the sensor
            gyroscope.start();

            // Listen for gyroscope data
            gyroscope.addEventListener('reading', () => {
                const gyroData = {
                    x: gyroscope.x, // Rotation rate around x-axis
                    y: gyroscope.y, // Rotation rate around y-axis
                    z: gyroscope.z  // Rotation rate around z-axis
                };

                // Log data to check it's being generated correctly
                console.log('Gyroscope data:', gyroData);

                // Display data on the page
                document.getElementById('data').textContent = `X: ${gyroData.x}, Y: ${gyroData.y}, Z: ${gyroData.z}`;

                // Send data to the server if WebSocket is open
                if (ws.readyState === WebSocket.OPEN) {
                    console.log('Sending gyroscope data to server:', gyroData); // Check if this log is printed
                    ws.send(JSON.stringify(gyroData)); // Send data as JSON string
                }
            });

            // Handle sensor errors
            gyroscope.addEventListener('error', (event) => {
                console.error('Gyroscope error:', event.error.name, event.error.message);
                document.getElementById('data').textContent = 'Gyroscope error: ' + event.error.message;
            });
        } catch (error) {
            console.error('Failed to initialize gyroscope:', error);
            document.getElementById('data').textContent = 'Gyroscope not supported or failed to initialize';
        }
    } else {
        document.getElementById('data').textContent = 'Gyroscope API not supported on this device';
    }
    </script>
       
</body>
</html>
